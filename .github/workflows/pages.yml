name: Deploy to GitHub Pages

# 網頁原始碼放在 src/，但 GitHub Pages 的「Deploy from a branch」只能選根目錄或 /docs，
# 所以改用 Actions 直接把 src/ 發佈出去，網址維持 https://wmcccc.github.io/moon_festival_hw/ 不變。
# 首次使用需到 Settings → Pages → Source 選擇 GitHub Actions。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload src/ as the site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
